name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install LLVM
      id: install-llvm
      uses: ZhongRuoyu/setup-llvm@v0
      with:
        llvm-version: 18
    - name: Build
      env:
        LLVM_SYS_181_PREFIX: ${{ steps.install-llvm.outputs.llvm-path }}
      run: cargo build --verbose
    - name: Run tests
      env:
        LLVM_SYS_181_PREFIX: ${{ steps.install-llvm.outputs.llvm-path }}
      run: cargo test --verbose
